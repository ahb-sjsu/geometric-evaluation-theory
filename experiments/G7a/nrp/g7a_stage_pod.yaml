# A short-lived bare pod used only to move files between Atlas and the volume
# with `kubectl cp`. The cluster allows `sleep` in an interactive bare pod and
# nowhere else, for at most six hours. This one is deleted as soon as the copy
# is done, and it is in the exempt class. It is never a Job.
apiVersion: v1
kind: Pod
metadata:
  name: g7a-stage
  labels: {app: get-g7a, role: staging}
spec:
  restartPolicy: Never
  activeDeadlineSeconds: 7200
  containers:
    - name: stage
      image: python:3.12-slim
      command: ["sleep", "7000"]
      resources:
        requests: {cpu: "1", memory: 1Gi, ephemeral-storage: 2Gi}
        limits:   {cpu: "1", memory: 1Gi, ephemeral-storage: 2Gi}
      volumeMounts:
        - {name: data, mountPath: /data}
  volumes:
    - name: data
      persistentVolumeClaim: {claimName: g7a-data}
